nextest-version = { required = "0.9.146", recommended = "0.9.146" }

[profile.default]
slow-timeout = "5s"
retries = 0

[profile.default.junit]
path = "junit.xml"
report-skipped = "all"

[profile.ci]
fail-fast = false

[profile.root]
inherits = "default"

[profile.root-ci]
inherits = "ci"

[profile.root-msrv]
inherits = "ci"

[profile.root-precision]
inherits = "default"

[profile.workers]
inherits = "default"

[profile.workers-ci]
inherits = "ci"

[profile.workers-classic-ci]
inherits = "ci"

[profile.workers-release]
inherits = "default"
