[package]
name = "emuella-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Reproducible, isolated codec experiments and conservative baseline comparisons"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "emuella-benchmark"
path = "src/main.rs"

[[bin]]
name = "protocol-test-worker"
path = "src/bin/protocol-test-worker.rs"
