name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Canonical verification
        run: sh scripts/check.sh
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Minimum supported Rust
        run: |
          rustc +1.88.0 -Vv
          cargo +1.88.0 check --locked --all-targets
  workers:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install independent codec tools and build prerequisites
        run: apt-get update && apt-get install -y libopenjp2-7-dev libopenjp2-tools openjph-tools pkg-config build-essential git ca-certificates python3 curl
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/checkout@v4
        with:
          repository: emuella/emuella-testdata
          ref: b4b8c8f51cd36ace3764487d53b5423dc6baab50
          path: catalogue
      - uses: actions/checkout@v4
        with:
          repository: emuella/emuella-j2k
          ref: 462a778109be97ad303c973d1a98a48b25ecedc3
          path: codec
      - name: Trust the checked-out repositories in the job container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/catalogue"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/codec"
          printf '/codec/\n' >> .git/info/exclude
      - name: Worker checks
        run: |
          cargo fmt --manifest-path workers/Cargo.toml -- --check
          cargo clippy --manifest-path workers/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path workers/Cargo.toml --all-targets
      - name: Authored classic existing-stream regression
        run: |
          cp workers/Cargo.lock "$RUNNER_TEMP/classic-worker-Cargo.lock"
          trap 'cp "$RUNNER_TEMP/classic-worker-Cargo.lock" workers/Cargo.lock' EXIT
          cargo test --manifest-path workers/Cargo.toml --features classic-compare \
            --test classic_compare authored_existing_reference_preflight_uses_encode_without_changing_stream \
            --config "patch.\"https://github.com/emuella/emuella-j2k\".emuella-j2k.path=\"$PWD/codec/crates/emuella-j2k\"" \
            --config "patch.\"https://github.com/emuella/emuella-j2k\".emuella-j2k-codestream.path=\"$PWD/codec/crates/emuella-j2k-codestream\""
      - name: Build identified workers and exercise real codecs
        run: |
          python3 scripts/build-workers.py --output "$RUNNER_TEMP/benchmark-workers"
          cargo build --release --bins
          python3 scripts/qualify.py --benchmark "$PWD/target/release/emuella-benchmark" --workers "$RUNNER_TEMP/benchmark-workers" --catalogue "$PWD/catalogue" --output "$RUNNER_TEMP/benchmark-qualification" --quick
